name: Act 1 checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell syntax and lint
        run: |
          bash -n scripts/*.sh tests/*.sh
          shellcheck -x scripts/*.sh tests/*.sh
      - name: Safety and learning acceptance
        run: bash tests/acceptance.sh
      - name: Documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md docs/*.md pcaps/*.md

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 tcpdump curl python3 python3-scapy iputils-ping traceroute
      - name: Neutralise bridge netfilter on the disposable runner
        run: |
          sudo systemctl stop docker.socket docker.service || true
          # Stopping the daemon does not undo the FORWARD policy or unload the module.
          sudo iptables -P FORWARD ACCEPT || true
          sudo modprobe -r br_netfilter || true
      - name: Run every lab for real
        run: sudo bash tests/smoke.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-evidence
          path: results/
          if-no-files-found: warn
