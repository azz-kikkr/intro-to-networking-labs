name: Act 1 checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell syntax and lint
        run: |
          bash -n scripts/*.sh tests/*.sh
          shellcheck -x scripts/*.sh tests/*.sh
      - name: Safety and learning acceptance
        run: bash tests/acceptance.sh
      - name: Documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress README.md docs/*.md pcaps/*.md

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 tcpdump curl python3 python3-scapy iputils-ping traceroute
      - name: Neutralise bridge netfilter on the disposable runner
        run: |
          sudo systemctl stop docker.socket docker.service || true
          # The hosted runner includes Docker. Stopping it does not undo the
          # bridge netfilter hooks that can consume frames before Linux bridge
          # forwarding. This runner is disposable; learner hosts are never
          # modified this way.
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=0
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl -w net.bridge.bridge-nf-call-arptables=0
      - name: Run every lab for real
        run: sudo bash tests/smoke.sh
      - name: Capture failure state
        if: failure()
        run: |
          {
            echo '### namespaces'
            sudo ip netns list
            echo '### mls1 links'
            ip -d -o link show | grep mls1 || true
            echo '### bridge links'
            sudo bridge -d link show
            echo '### bridge VLANs'
            sudo bridge vlan show
            echo '### bridge FDB'
            sudo bridge fdb show
            echo '### bridge netfilter'
            sudo sysctl net.bridge.bridge-nf-call-iptables \
              net.bridge.bridge-nf-call-ip6tables \
              net.bridge.bridge-nf-call-arptables
          } | tee runtime-failure-state.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-evidence-${{ matrix.os }}
          path: |
            results/
            runtime-failure-state.txt
          if-no-files-found: warn
