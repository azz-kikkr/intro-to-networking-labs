<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0c0a1c"/>

  <!-- Title -->
  <text x="30" y="35" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">Lab 02: IP Addresses</text>

  <!-- Namespace A -->
  <rect x="60" y="140" width="220" height="120" rx="14" ry="14" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="172" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l02-a</text>
  <text x="170" y="196" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">192.0.2.10/26</text>
  <text x="170" y="216" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:02:00:10</text>
  <text x="170" y="240" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">namespace</text>

  <!-- Bridge -->
  <rect x="360" y="155" width="180" height="90" rx="14" ry="14" fill="rgba(147,197,114,0.08)" stroke="#93c572" stroke-width="2"/>
  <text x="450" y="192" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l02-br</text>
  <text x="450" y="214" fill="#93c572" font-family="monospace" font-size="10" text-anchor="middle">Linux bridge</text>

  <!-- Namespace B -->
  <rect x="620" y="140" width="220" height="120" rx="14" ry="14" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="2"/>
  <text x="730" y="172" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l02-b</text>
  <text x="730" y="196" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">192.0.2.20/26</text>
  <text x="730" y="216" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:02:00:20</text>
  <text x="730" y="240" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">namespace</text>

  <!-- Connection: A to bridge -->
  <line x1="280" y1="200" x2="360" y2="200" stroke="#38bdf8" stroke-width="3"/>
  <text x="320" y="190" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>

  <!-- Connection: bridge to B -->
  <line x1="540" y1="200" x2="620" y2="200" stroke="#fb923c" stroke-width="3"/>
  <text x="580" y="190" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>

  <!-- Flow arrow indicators -->
  <polygon points="355,200 345,195 345,205" fill="#38bdf8"/>
  <polygon points="615,200 605,195 605,205" fill="#fb923c"/>

  <!-- Subnet annotation -->
  <rect x="160" y="300" width="580" height="40" rx="8" ry="8" fill="rgba(147,197,114,0.06)" stroke="#93c572" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="450" y="325" fill="#93c572" font-family="monospace" font-size="12" text-anchor="middle">Same subnet: 192.0.2.0/26 (no router needed)</text>

  <!-- Legend -->
  <text x="30" y="380" fill="#9590a8" font-family="monospace" font-size="11">Both hosts share the same /26 subnet, direct L2 communication via bridge</text>
</svg>
