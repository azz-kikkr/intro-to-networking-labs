<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0c0a1c"/>

  <!-- Title -->
  <text x="30" y="35" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">Lab 01: Browser to Wire</text>

  <!-- Client namespace -->
  <rect x="60" y="140" width="220" height="120" rx="14" ry="14" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="172" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l01-client</text>
  <text x="170" y="196" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">10.1.1.10/24</text>
  <text x="170" y="216" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:01:01:10</text>
  <text x="170" y="240" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">namespace</text>

  <!-- Bridge -->
  <rect x="360" y="155" width="180" height="90" rx="14" ry="14" fill="rgba(147,197,114,0.08)" stroke="#93c572" stroke-width="2"/>
  <text x="450" y="192" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l01-br</text>
  <text x="450" y="214" fill="#93c572" font-family="monospace" font-size="10" text-anchor="middle">Linux bridge</text>
  <text x="450" y="234" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">capture point</text>

  <!-- Server namespace -->
  <rect x="620" y="140" width="220" height="120" rx="14" ry="14" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="2"/>
  <text x="730" y="172" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l01-server</text>
  <text x="730" y="196" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">10.1.1.20/24</text>
  <text x="730" y="216" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:01:01:20</text>
  <text x="730" y="240" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">python3 HTTP :8080</text>

  <!-- Connection: client to bridge -->
  <line x1="280" y1="200" x2="360" y2="200" stroke="#38bdf8" stroke-width="3"/>
  <text x="320" y="190" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>

  <!-- Connection: bridge to server -->
  <line x1="540" y1="200" x2="620" y2="200" stroke="#fb923c" stroke-width="3"/>
  <text x="580" y="190" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>

  <!-- Flow arrow indicators -->
  <polygon points="355,200 345,195 345,205" fill="#38bdf8"/>
  <polygon points="615,200 605,195 605,205" fill="#fb923c"/>

  <!-- Legend -->
  <text x="30" y="340" fill="#9590a8" font-family="monospace" font-size="11">Topology: client --veth--> bridge --veth--> server</text>
  <text x="30" y="360" fill="#9590a8" font-family="monospace" font-size="11">Capture: tcpdump on bridge interface</text>
</svg>
