<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0c0a1c"/>

  <!-- Title -->
  <text x="30" y="35" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">Lab 03: Subnet Boundaries</text>

  <!-- Left namespace -->
  <rect x="40" y="140" width="200" height="110" rx="14" ry="14" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="170" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l03-left</text>
  <text x="140" y="194" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">192.0.2.10/26</text>
  <text x="140" y="214" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">subnet: 192.0.2.0/26</text>
  <text x="140" y="236" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">gw: 192.0.2.1</text>

  <!-- Router namespace -->
  <rect x="320" y="120" width="260" height="160" rx="14" ry="14" fill="rgba(250,204,21,0.08)" stroke="#facc15" stroke-width="2"/>
  <text x="450" y="152" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l03-router</text>
  <text x="450" y="176" fill="#facc15" font-family="monospace" font-size="10" text-anchor="middle">ip_forward=1</text>
  <text x="380" y="202" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">left0:</text>
  <text x="380" y="218" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">192.0.2.1/26</text>
  <text x="520" y="202" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">right0:</text>
  <text x="520" y="218" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">192.0.2.65/26</text>
  <text x="450" y="260" fill="#facc15" font-family="monospace" font-size="9" text-anchor="middle">rewrites L2 headers, preserves L3</text>

  <!-- Right namespace -->
  <rect x="660" y="140" width="200" height="110" rx="14" ry="14" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="2"/>
  <text x="760" y="170" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l03-right</text>
  <text x="760" y="194" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">192.0.2.70/26</text>
  <text x="760" y="214" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">subnet: 192.0.2.64/26</text>
  <text x="760" y="236" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">gw: 192.0.2.65</text>

  <!-- Connection: left to router -->
  <line x1="240" y1="195" x2="320" y2="195" stroke="#38bdf8" stroke-width="3"/>
  <text x="280" y="185" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>
  <polygon points="315,195 305,190 305,200" fill="#38bdf8"/>

  <!-- Connection: router to right -->
  <line x1="580" y1="195" x2="660" y2="195" stroke="#fb923c" stroke-width="3"/>
  <text x="620" y="185" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>
  <polygon points="655,195 645,190 645,200" fill="#fb923c"/>

  <!-- Subnet labels at bottom -->
  <rect x="40" y="320" width="250" height="30" rx="6" ry="6" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="165" y="340" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">192.0.2.0/26</text>

  <rect x="610" y="320" width="250" height="30" rx="6" ry="6" fill="rgba(251,146,60,0.06)" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="735" y="340" fill="#fb923c" font-family="monospace" font-size="11" text-anchor="middle">192.0.2.64/26</text>

  <!-- Legend -->
  <text x="30" y="380" fill="#9590a8" font-family="monospace" font-size="11">Two /26 subnets connected by a forwarding namespace (router)</text>
</svg>
