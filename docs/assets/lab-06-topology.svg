<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0c0a1c"/>

  <!-- Title -->
  <text x="30" y="35" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">Lab 06: Layer 2 Capstone</text>

  <!-- Core bridge (top center) -->
  <rect x="350" y="50" width="200" height="70" rx="14" ry="14" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="80" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">Core</text>
  <text x="450" y="100" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">STP priority 8192 (root)</text>

  <!-- East bridge (left) -->
  <rect x="80" y="180" width="180" height="60" rx="14" ry="14" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="207" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">East</text>
  <text x="170" y="227" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">bridge</text>

  <!-- West bridge (right) -->
  <rect x="470" y="180" width="180" height="60" rx="14" ry="14" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="2"/>
  <text x="560" y="207" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">West</text>
  <text x="560" y="227" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">bridge</text>

  <!-- Edge bridge (far right) -->
  <rect x="720" y="180" width="140" height="60" rx="14" ry="14" fill="rgba(147,197,114,0.08)" stroke="#93c572" stroke-width="2"/>
  <text x="790" y="207" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">Edge</text>
  <text x="790" y="227" fill="#93c572" font-family="monospace" font-size="10" text-anchor="middle">bridge</text>

  <!-- Trunk: Core to East -->
  <line x1="370" y1="120" x2="220" y2="180" stroke="#a78bfa" stroke-width="3"/>
  <text x="280" y="145" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">trunk</text>
  <text x="280" y="158" fill="#9590a8" font-family="monospace" font-size="8" text-anchor="middle">VLAN 110+120</text>

  <!-- Trunk: Core to West -->
  <line x1="530" y1="120" x2="560" y2="180" stroke="#a78bfa" stroke-width="3"/>
  <text x="560" y="145" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">trunk</text>
  <text x="560" y="158" fill="#9590a8" font-family="monospace" font-size="8" text-anchor="middle">VLAN 110+120</text>

  <!-- Trunk: East to West (STP blocked, dashed) -->
  <line x1="260" y1="210" x2="470" y2="210" stroke="#ff4d4d" stroke-width="3" stroke-dasharray="8,5"/>
  <text x="365" y="200" fill="#ff4d4d" font-family="monospace" font-size="9" text-anchor="middle">STP BLOCKED</text>
  <text x="365" y="222" fill="#9590a8" font-family="monospace" font-size="8" text-anchor="middle">VLAN 110+120</text>

  <!-- Trunk: West to Edge -->
  <line x1="650" y1="210" x2="720" y2="210" stroke="#93c572" stroke-width="3"/>
  <text x="685" y="200" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">trunk</text>

  <!-- Host A on East (VLAN 110) -->
  <rect x="60" y="290" width="160" height="80" rx="10" ry="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="312" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">Host A</text>
  <text x="140" y="330" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">VLAN 110</text>
  <text x="140" y="348" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">10.110.3.10</text>
  <line x1="140" y1="290" x2="170" y2="240" stroke="#38bdf8" stroke-width="2"/>

  <!-- Host B on West (VLAN 110) -->
  <rect x="440" y="290" width="160" height="80" rx="10" ry="10" fill="rgba(251,146,60,0.06)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="520" y="312" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">Host B</text>
  <text x="520" y="330" fill="#fb923c" font-family="monospace" font-size="9" text-anchor="middle">VLAN 110</text>
  <text x="520" y="348" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">10.110.3.12</text>
  <line x1="520" y1="290" x2="540" y2="240" stroke="#fb923c" stroke-width="2"/>

  <!-- Host C (witness) on Edge (VLAN 110) -->
  <rect x="700" y="290" width="160" height="80" rx="10" ry="10" fill="rgba(250,204,21,0.06)" stroke="#facc15" stroke-width="1.5"/>
  <text x="780" y="312" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">Host C</text>
  <text x="780" y="330" fill="#facc15" font-family="monospace" font-size="9" text-anchor="middle">VLAN 110 (witness)</text>
  <text x="780" y="348" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">10.110.3.30</text>
  <line x1="780" y1="290" x2="790" y2="240" stroke="#facc15" stroke-width="2"/>

  <!-- App on West (VLAN 120) -->
  <rect x="600" y="290" width="90" height="80" rx="10" ry="10" fill="rgba(244,114,182,0.06)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="645" y="312" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">App</text>
  <text x="645" y="330" fill="#f472b6" font-family="monospace" font-size="9" text-anchor="middle">VLAN 120</text>
  <text x="645" y="348" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">10.120.3.50</text>
  <line x1="645" y1="290" x2="580" y2="240" stroke="#f472b6" stroke-width="2"/>

  <!-- Legend -->
  <rect x="30" y="382" width="10" height="3" fill="#ff4d4d"/>
  <text x="46" y="387" fill="#9590a8" font-family="monospace" font-size="9">= STP blocked link</text>
  <rect x="180" y="382" width="10" height="3" fill="#a78bfa"/>
  <text x="196" y="387" fill="#9590a8" font-family="monospace" font-size="9">= active trunk (VLAN 110+120)</text>
</svg>
