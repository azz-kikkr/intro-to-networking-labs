<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0c0a1c"/>

  <!-- Title -->
  <text x="30" y="35" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">Lab 04: Ethernet Frames</text>

  <!-- Bridge (center) -->
  <rect x="360" y="60" width="180" height="70" rx="14" ry="14" fill="rgba(147,197,114,0.08)" stroke="#93c572" stroke-width="2"/>
  <text x="450" y="92" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l04-br</text>
  <text x="450" y="112" fill="#93c572" font-family="monospace" font-size="10" text-anchor="middle">Linux bridge</text>

  <!-- Sender (namespace A) -->
  <rect x="60" y="200" width="220" height="130" rx="14" ry="14" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="230" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l04-a</text>
  <text x="170" y="252" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">"sender"</text>
  <text x="170" y="274" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">198.51.100.10/24</text>
  <text x="170" y="294" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:04:00:10</text>

  <!-- Receiver (namespace B) -->
  <rect x="620" y="200" width="220" height="130" rx="14" ry="14" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="2"/>
  <text x="730" y="230" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l04-b</text>
  <text x="730" y="252" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">"receiver"</text>
  <text x="730" y="274" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">198.51.100.20/24</text>
  <text x="730" y="294" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:04:00:20</text>

  <!-- Witness (namespace) -->
  <rect x="340" y="230" width="220" height="130" rx="14" ry="14" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="260" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l04-witness</text>
  <text x="450" y="282" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">"witness"</text>
  <text x="450" y="304" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">198.51.100.30/24</text>
  <text x="450" y="324" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:04:00:30</text>

  <!-- Connection: sender to bridge -->
  <line x1="170" y1="200" x2="400" y2="130" stroke="#38bdf8" stroke-width="3"/>
  <text x="270" y="155" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>

  <!-- Connection: receiver to bridge -->
  <line x1="730" y1="200" x2="500" y2="130" stroke="#fb923c" stroke-width="3"/>
  <text x="630" y="155" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>

  <!-- Connection: witness to bridge -->
  <line x1="450" y1="230" x2="450" y2="130" stroke="#a78bfa" stroke-width="3"/>
  <text x="465" y="180" fill="#9590a8" font-family="monospace" font-size="9">veth</text>

  <!-- Key point -->
  <text x="30" y="380" fill="#9590a8" font-family="monospace" font-size="11">Witness sees broadcast and unknown-unicast floods from the bridge</text>
</svg>
