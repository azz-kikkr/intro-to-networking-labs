<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0c0a1c"/>

  <!-- Title -->
  <text x="30" y="35" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">Lab 05: ARP Resolution</text>

  <!-- Namespace A -->
  <rect x="60" y="130" width="240" height="140" rx="14" ry="14" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="162" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l05-a</text>
  <text x="180" y="186" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">203.0.113.10/24</text>
  <text x="180" y="206" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:05:00:10</text>
  <text x="180" y="232" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">ARP request sender</text>
  <text x="180" y="252" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">"Who has 203.0.113.20?"</text>

  <!-- Bridge -->
  <rect x="380" y="155" width="140" height="90" rx="14" ry="14" fill="rgba(147,197,114,0.08)" stroke="#93c572" stroke-width="2"/>
  <text x="450" y="192" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l05-br</text>
  <text x="450" y="214" fill="#93c572" font-family="monospace" font-size="10" text-anchor="middle">Linux bridge</text>
  <text x="450" y="232" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">floods broadcast</text>

  <!-- Namespace B -->
  <rect x="600" y="130" width="240" height="140" rx="14" ry="14" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="2"/>
  <text x="720" y="162" fill="#ffffff" font-family="monospace" font-size="13" text-anchor="middle">mls1-l05-b</text>
  <text x="720" y="186" fill="#9590a8" font-family="monospace" font-size="11" text-anchor="middle">203.0.113.20/24</text>
  <text x="720" y="206" fill="#9590a8" font-family="monospace" font-size="10" text-anchor="middle">MAC 02:00:00:05:00:20</text>
  <text x="720" y="232" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">ARP reply sender</text>
  <text x="720" y="252" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">"I am 02:00:00:05:00:20"</text>

  <!-- Connection: A to bridge -->
  <line x1="300" y1="200" x2="380" y2="200" stroke="#38bdf8" stroke-width="3"/>
  <text x="340" y="190" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>
  <polygon points="375,200 365,195 365,205" fill="#38bdf8"/>

  <!-- Connection: bridge to B -->
  <line x1="520" y1="200" x2="600" y2="200" stroke="#fb923c" stroke-width="3"/>
  <text x="560" y="190" fill="#9590a8" font-family="monospace" font-size="9" text-anchor="middle">veth</text>
  <polygon points="595,200 585,195 585,205" fill="#fb923c"/>

  <!-- ARP flow arrows -->
  <!-- Request (broadcast) arrow -->
  <line x1="200" y1="310" x2="700" y2="310" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="700,310 690,305 690,315" fill="#38bdf8"/>
  <text x="450" y="300" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">ARP Request (broadcast, dst ff:ff:ff:ff:ff:ff)</text>

  <!-- Reply (unicast) arrow -->
  <line x1="700" y1="340" x2="200" y2="340" stroke="#fb923c" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="200,340 210,335 210,345" fill="#fb923c"/>
  <text x="450" y="360" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">ARP Reply (unicast, dst 02:00:00:05:00:10)</text>

  <!-- Legend -->
  <text x="30" y="390" fill="#9590a8" font-family="monospace" font-size="11">Key: ARP request is broadcast, ARP reply is unicast</text>
</svg>
